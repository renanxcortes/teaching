# Layout vertical (contents e sections)
website:
  title: "Teaching"
  repo-url: https://github.com/renanxcortes/teaching
  repo-actions: [edit, source, issue]
  reader-mode: true
  favicon: figs/logo.png
  navbar:
    background: primary
    search: true
    left:
      - text: "Sobre"
        href: index.qmd
      - text: "Temas"
        menu:
          - sidebar:est_neg
          - sidebar:met_est
          - sidebar:int_prob
          - sidebar:probabilidade_B
          - sidebar:modelos_lineares
          - sidebar:multivariada

  sidebar:
    - id: est_neg
      title: "Estatística Aplicada a Negócios"
      collapse-level: 2
      style: "docked"
      search: true
      contents:
        - section: "Apresentação"
          contents:
            - Estatistica_Aplicada_Negocios/1_apresentacao_da_disciplina.qmd
        - section: "Introdução Teórica"
          contents:
            - Estatistica_Aplicada_Negocios/2_introducao_teorica_estatistica_negocios.qmd
        - section: "Workflow de um Produto de Dados"
          contents:
            - Estatistica_Aplicada_Negocios/3_workflow_produto_dados_crisp_dm.qmd
        - section: "Desafios de Bases de Dados (Semanas 5-7)"
          contents:
            - Estatistica_Aplicada_Negocios/4_desafios_base_negocio.qmd
            - Estatistica_Aplicada_Negocios/5_desafios_base_operacional.qmd
        - section: "Técnicas Estatísticas em Diferentes Contextos (Semanas 8-18)"
          contents:
            - Estatistica_Aplicada_Negocios/6_estudo_caso_ecommerce_olist.qmd
            - Estatistica_Aplicada_Negocios/7_estudo_caso_credito_cobranca.qmd
            - Estatistica_Aplicada_Negocios/8_estudo_caso_imoveis.qmd
            - Estatistica_Aplicada_Negocios/9_estudo_caso_setor_publico.qmd
            - Estatistica_Aplicada_Negocios/10_estudo_caso_dashboards_looker_studio.qmd
            - Estatistica_Aplicada_Negocios/11_estudo_caso_deteccao_fraudes_clustering.qmd

    - id: met_est
      title: "Métodos Estatísticos"
      collapse-level: 2
      style: "docked"
      search: true
      contents:
        - section: "Apresentação"
          contents:
            - Metodos_Estatisticos/0_apresentacao_da_disciplina.qmd
        - section: "Introdução e Análise Exploratória"
          contents:
            - Metodos_Estatisticos/1_introducao_exploratoria.qmd
        - section: "Estatística Descritiva - Medidas"
          contents:
            - Metodos_Estatisticos/2_descritiva_medidas.qmd
        - section: "Probabilidade (Semanas 5-6)"
          contents:
            - Metodos_Estatisticos/3_probabilidade.qmd
        - section: "Amostragem e Estimação (Semanas 7-8)"
          contents:
            - Metodos_Estatisticos/4_amostragem_estimacao.qmd
        - section: "Teste de Hipóteses: z e t (Semanas 9-10)"
          contents:
            - Metodos_Estatisticos/5_teste_hipoteses_z_t.qmd
        - section: "Teste de Hipóteses: ANOVA (Semanas 11-15)"
          contents:
            - Metodos_Estatisticos/6_anova.qmd
        - section: "Correlação, Regressão e Qui-Quadrado (Semanas 16-18)"
          contents:
            - Metodos_Estatisticos/7_correlacao_regressao_qui_quadrado.qmd

    - id: int_prob
      title: "Introdução à Probabilidade"
      collapse-level: 2
      style: "docked"
      search: true
      contents:
        - section: "Probabilidade"
          contents:
            - Int_Prob/1_experimento_aleatorio.qmd
            - Int_Prob/2_conceitos_de_probabilidade.qmd
            - Int_Prob/3_aplicacoes_probabilidade_combinatoria.qmd
            - Int_Prob/4_probabilidade_condicional_e_independencia.qmd
        - section: "Variáveis Aleatórias"
          contents:
            - Int_Prob/5_variaveis_aleatorias_conceitos_basicos.qmd
            - Int_Prob/6_vetores_aleatorios.qmd
            - Int_Prob/7_funcoes_de_variaveis_aleatorias.qmd

    - id: probabilidade_B
      title: "Probabilidade Avançada"
      collapse-level: 2
      style: "docked"
      search: true
      contents:
        - section: "Grandes Amostras"
          contents:
            - Probabilidade_B/LGN.qmd
            - Probabilidade_B/TCL.qmd

    - id: modelos_lineares
      title: "Modelos Lineares"
      collapse-level: 2
      style: "docked"
      search: true
      contents:
        - section: "Confundimento"
          contents:
            - Modelos_Lineares/paradoxo_simpson.qmd

    - id: multivariada
      title: "Análise Multivariada"
      collapse-level: 2
      style: "docked"
      search: true
      contents:
        - section: "Principais Tópicos"
          contents:
            - Multivariada/Componentes_Principais.qmd
            - Multivariada/Cluster.qmd



format:
  html:
    theme:
      - cosmo
    css: styles.css

editor: visual

bibliography: references.bib